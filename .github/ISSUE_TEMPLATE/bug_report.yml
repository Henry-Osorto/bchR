name: Error reproducible
description: Informar un fallo con datos sintéticos o públicos autorizados.
title: "[Error] "
body:
  - type: markdown
    attributes:
      value: "No incluyas claves, tokens, archivos .Renviron ni URLs con credenciales. Para vulnerabilidades, consulta SECURITY.md."
  - type: input
    id: versions
    attributes:
      label: Versiones de R y bchR; sistema operativo
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Ejemplo mínimo sin secretos
      description: Usa datos ficticios. No pegues una respuesta privada completa.
      render: r
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Resultado esperado y observado
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Revisión de privacidad
      options:
        - label: He revisado que el reporte no incluya credenciales ni información privada.
          required: true
